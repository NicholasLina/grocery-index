name: Scheduled StatCan SQLite Import

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  import-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      SQLITE_PATH: backend/data/grocery-index.db
      STATIC_JSON_OUTPUT_DIR: react-frontend/data
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Import latest StatCan data into SQLite and static JSON
        run: python import-statcan-sqlite.py

      - name: Run storage unit tests
        run: python -m unittest tests/test_storage.py

      - name: Warm up SQLite API (optional)
        if: env.API_BASE_URL != ''
        run: npm run warmup
        working-directory: backend

      - name: Upload SQLite artifact
        uses: actions/upload-artifact@v4
        with:
          name: grocery-index-sqlite-db
          path: backend/data/grocery-index.db
          if-no-files-found: ignore

      - name: Upload static JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: grocery-index-static-json
          path: react-frontend/data/**
          if-no-files-found: ignore
